# Project configuration. One file declares the package, its dependencies,
# and the settings for both development tools (ruff and pytest).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "it-equipment-mcp"
version = "0.1.0"
description = "An MCP server and agent that handle internal IT equipment requests."
requires-python = ">=3.12"

# Pinned exactly, for the same reason the development tools below are: CI and a
# local machine then run identical code.
dependencies = [
    "mcp==2.3.0",
    # The MCP SDK installs this itself, to make its HTTP requests. It is listed
    # here as well because the connection check imports from it directly, to
    # recognise a failure to reach the server, and a package should declare
    # everything it imports rather than rely on another one bringing it along.
    "httpx2==2.16.2",
]

# Installed only for development and in CI, via: pip install -e ".[dev]"
# Versions are pinned exactly so CI and a local machine run identical tools.
[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

# The package lives in src/ rather than the repository root. This guarantees
# tests import the installed package, not loose files in the working directory.
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
# Check Python files only. Recent ruff versions also format Markdown, which
# would make CI depend on the formatting of documents such as the lab brief.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
# A deliberately small rule set: pycodestyle errors, pyflakes, import sorting.
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
