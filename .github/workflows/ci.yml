# Continuous integration: every push and pull request must install the
# project, pass the linter and formatter, and pass the test suite.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project and its development tools
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest

      # The tests above call the plain functions directly, so nothing so far
      # proves the server starts or that the tool is registered with it. This
      # runs the same check by hand, which is what would catch a missing
      # decorator or a change of transport.
      - name: Confirm the server starts and its tool is callable
        run: |
          python -m it_equipment.server > server.log 2>&1 &
          python - <<'PY'
          import socket
          import sys
          import time

          from it_equipment.config import load_settings

          settings = load_settings()

          # The server needs a moment to bind the port. Without this wait the
          # client would run first and be refused a connection.
          for _ in range(60):
              try:
                  socket.create_connection((settings.host, settings.port), timeout=0.5).close()
                  sys.exit(0)
              except OSError:
                  time.sleep(0.5)

          sys.exit(f"the server never listened on {settings.host}:{settings.port}")
          PY
          python scripts/check_connection.py

      - name: Show the server log if the check failed
        if: failure()
        run: cat server.log
